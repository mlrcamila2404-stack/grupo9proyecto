<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practify - Page Not Found</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="img/image.png">
  <style>
     :root {
      --ink: #16213E;
      --ink-soft: rgba(22, 33, 62, 0.65);
      --blue: #3A86FF;
      --purple: #7C3AED;
      --cyan: #06B6D4;
      --yellow: #FFC857;
      --cream: #F7F5F0;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(160deg, #FFF4D9 0%, var(--cream) 60%);
      font-family: 'Poppins', sans-serif;
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .wordmark {
      font-weight: 800;
      font-size: 1.4rem;
      margin-bottom: 40px;
    }
    .wordmark .w-blue { color: var(--blue); }
    .wordmark .w-purple { color: var(--purple); }
    .error-code {
      font-size: 6rem;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, var(--blue), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .error-icon {
      font-size: 3rem;
      margin-bottom: 10px;
    }
    h2 {
      font-weight: 700;
      margin: 10px 0 8px;
    }
    p.sub {
      color: var(--ink-soft);
      max-width: 380px;
      margin: 0 auto 28px;
    }
    .btn-home {
      background-color: var(--blue);
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 0.75rem 2rem;
      font-weight: 600;
      text-decoration: none;
      display: inline-block;
      transition: background-color 0.2s ease, transform 0.15s ease;
    }
    .btn-home:hover {
      background-color: var(--cyan);
      color: #fff;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div>
    <div class="wordmark"><span class="w-blue">Pract</span><span class="w-purple">ify</span></div>
    <div class="error-icon">🧭⚠️</div>
    <div class="error-code">404</div>
    <h2>Looks like this page skipped practice</h2>
    <p class="sub">The page you're looking for doesn't exist or may have moved. Let's get you back on track.</p>
    <a href="examenes.html" class="btn-home">Back to Home</a>
  </div>
</body>
</html>
