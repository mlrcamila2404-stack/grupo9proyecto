<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practify - My History</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="img/image.png">
  <style>
    .history-shell {
      min-height: calc(100vh - 120px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 40px 20px;
    }
    .history-panel {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 30px;
      padding: 50px 40px;
      width: 100%;
      max-width: 900px;
      box-shadow: 0 25px 50px var(--shadow);
      z-index: 1;
    }
    .history-item {
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(22, 33, 62, 0.05);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: var(--transition);
    }
    .history-item:hover {
      transform: translateY(-3px);
      background: var(--white);
      box-shadow: 0 10px 20px var(--shadow);
    }
    .history-info {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .history-date {
      font-size: 0.85rem;
      color: rgba(22, 33, 62, 0.5);
      white-space: nowrap;
    }
    .history-title {
      font-weight: 700;
      margin: 0;
      color: var(--ink);
    }
    .history-score {
      font-weight: 800;
      font-size: 1.2rem;
      color: var(--blue);
      margin-right: 20px;
    }
    .btn-review {
      background: var(--ink);
      color: var(--white);
      border: none;
      border-radius: 100px;
      padding: 8px 20px;
      font-weight: 600;
      text-decoration: none;
      transition: var(--transition);
      font-size: 0.9rem;
    }
    .btn-review:hover {
      background: var(--purple);
      color: var(--white);
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-light">
    <div class="container">
      <a class="navbar-brand wordmark-nav" href="home.html"><span class="w-blue">Pract</span><span class="w-purple">ify</span></a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto" id="navSlider">
          <span class="nav-pill-indicator" id="navPillIndicator"></span>
          <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="examenes.html">Exams</a></li>
          <li class="nav-item"><a class="nav-link active" href="historial.html">History</a></li>
          <li class="nav-item"><a class="nav-link" href="sobre.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="perfil.html">Profile</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="history-shell">
    <div class="auth-blob-field">
      <div class="auth-blob auth-blob-a"></div>
      <div class="auth-blob auth-blob-b"></div>
    </div>

    <div class="history-panel reveal">
      <div class="text-center mb-5">
        <h2 class="fw-bold">My Completed Exams</h2>
        <p class="text-muted">Review your performance and learn from your mistakes.</p>
      </div>

      <div id="historyList">
        <div class="text-center py-5">
          <div class="spinner-border text-primary" role="status"></div>
          <p class="mt-3 text-muted">Loading your history...</p>
        </div>
      </div>

      <div class="text-center mt-4">
        <a href="examenes.html" class="btn-practfy">Take Another Exam</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/historial.js"></script>
  <script>
    const navList = document.getElementById('navSlider');
    const navIndicator = document.getElementById('navPillIndicator');
    const navLinks = navList?.querySelectorAll('.nav-link');

    function moveNavIndicator(el) {
      if (!el || !navIndicator) return;
      navIndicator.style.left = el.offsetLeft + 'px';
      navIndicator.style.width = el.offsetWidth + 'px';
    }

    if (navLinks) {
      const activeNavLink = navList.querySelector('.nav-link.active');
      requestAnimationFrame(() => moveNavIndicator(activeNavLink));
      navLinks.forEach((link) => {
        link.addEventListener('mouseenter', () => moveNavIndicator(link));
      });
      navList.addEventListener('mouseleave', () => moveNavIndicator(activeNavLink));
      window.addEventListener('resize', () => moveNavIndicator(navList.querySelector('.nav-link.active')));
    }
  </script>
</body>
</html>
