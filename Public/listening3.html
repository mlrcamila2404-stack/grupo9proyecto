<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practify - Listening Practice</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/listening1.css">
  <link rel="icon" type="image/png" href="img/image.png">
</head>
<body class="container py-5" data-fresh-attempt="true" data-auto-init="false">

  <h1 class="mb-4 text-center">Listening Practice</h1>
  <section class="container my-4 border rounded bg-light p-3">
    <h3 class="text-primary">Part 3: Conversation</h3>
    <p class="lead">Listen to the audio and respond to the questions about the conversation.</p>
  </section>

  <div class="quiz-progress mb-4">
    <div class="quiz-progress-top"><span id="quizProgressLabel">0 of 12 answered</span></div>
    <div class="progress-track"><div class="progress-fill" id="quizProgressBar"></div></div>
  </div>

  <div id="quizContainer"></div>

  <div class="mt-4 text-center">
    <button type="button" class="btn btn-primary" onclick="finalizarPrueba(4)">Finalize Practice</button>
  </div>

  <script src="js/quiz.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      cargarPreguntas(4, 'quizContainer');
    });
  </script>
</body>
</html>
