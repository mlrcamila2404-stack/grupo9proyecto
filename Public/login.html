<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practify - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="img/image.png">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-light">
    <div class="container">
      <a class="navbar-brand wordmark-nav" href="home.html"><span class="w-blue">Pract</span><span class="w-purple">ify</span></a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto" id="navSlider">
          <span class="nav-pill-indicator" id="navPillIndicator"></span>
          <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="examenes.html">Exams</a></li>
          <li class="nav-item"><a class="nav-link" href="historial.html">History</a></li>
          <li class="nav-item"><a class="nav-link" href="sobre.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="perfil.html">Profile</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="auth-shell">
    <div class="auth-blob-field">
      <div class="auth-blob auth-blob-a"></div>
      <div class="auth-blob auth-blob-b"></div>
    </div>

    <div class="auth-panel reveal">
      <div class="auth-wordmark"><span class="w-blue">Pract</span><span class="w-purple">ify</span></div>
      <div class="auth-pitch">
        <p>Listening, Reading and more test-style exams, ready when you want.</p>
      </div>

      <form id="form-login" class="auth-form">
        <h2 class="fw-bold mb-4">Login</h2>

        <div class="field">
          <label for="correo">Email Address</label>
          <input type="email" id="correo" name="correo" class="form-control" placeholder="your.email@example.com" autocomplete="email" required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Your password" autocomplete="current-password" required>
        </div>

        <div id="login-error" class="text-danger small mb-3"></div>

        <button type="submit" class="btn-practfy w-100">Login</button>

        <div class="auth-switch">
          Don't have an account? <a href="registro.html">Sign Up</a>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/login.js"></script>
  <script>
    const navList = document.getElementById('navSlider');
    const navIndicator = document.getElementById('navPillIndicator');
    const navLinks = navList?.querySelectorAll('.nav-link');

    function moveNavIndicator(el) {
      if (!el || !navIndicator) return;
      navIndicator.style.left = el.offsetLeft + 'px';
      navIndicator.style.width = el.offsetWidth + 'px';
    }

    if (navLinks) {
      const activeNavLink = navList.querySelector('.nav-link.active');
      requestAnimationFrame(() => moveNavIndicator(activeNavLink));
      navLinks.forEach((link) => {
        link.addEventListener('mouseenter', () => moveNavIndicator(link));
      });
      navList.addEventListener('mouseleave', () => moveNavIndicator(activeNavLink));
      window.addEventListener('resize', () => moveNavIndicator(navList.querySelector('.nav-link.active')));
    }
  </script>
</body>
</html>
