<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practify - Reading Practice</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/exam.css">
  <link rel="icon" type="image/png" href="img/image.png">
</head>
<body data-fresh-attempt="true" data-auto-init="false">

  <nav class="navbar navbar-expand-lg navbar-light">
    <div class="container">
      <a class="navbar-brand wordmark-nav" href="home.html"><span class="w-blue">Pract</span><span class="w-purple">ify</span></a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto" id="navSlider">
          <span class="nav-pill-indicator" id="navPillIndicator"></span>
          <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="examenes.html">Exams</a></li>
          <li class="nav-item"><a class="nav-link" href="historial.html">History</a></li>
          <li class="nav-item"><a class="nav-link" href="sobre.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="perfil.html">Profile</a></li>
          
        </ul>
      </div>
    </div>
  </nav>

  <div class="exam-shell">
    <div class="exam-blob-field">
      <div class="exam-blob exam-blob-a"></div>
      <div class="exam-blob exam-blob-b"></div>
    </div>

    <div class="exam-container">
      <div class="exam-header reveal">
        <h1>Reading Practice</h1>
      </div>

      <div class="exam-intro-panel reveal">
        <h3>Part 1: Incomplete Sentences</h3>
        <p class="lead mb-0">Read the sentence and choose the best answer.</p>
      </div>

      <div class="progress-wrapper reveal">
        <div class="quiz-progress">
          <div class="quiz-progress-info" id="quizProgressLabel">Loading...</div>
          <div class="progress-track">
            <div class="progress-fill" id="quizProgressBar"></div>
          </div>
        </div>
      </div>

      <div id="quizContainer">
        <p class="text-center text-muted">Loading questions...</p>
      </div>

      <div class="text-center mt-5 mb-5">
        <button type="button" class="btn-finalize" onclick="finalizarPrueba(1)">Finalize Practice</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/quiz.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await cargarPreguntas(1, 'quizContainer');
    });

    const navList = document.getElementById('navSlider');
    const navIndicator = document.getElementById('navPillIndicator');
    const navLinks = navList?.querySelectorAll('.nav-link');

    function moveNavIndicator(el) {
      if (!el || !navIndicator) return;
      navIndicator.style.left = el.offsetLeft + 'px';
      navIndicator.style.width = el.offsetWidth + 'px';
    }

    if (navLinks) {
      const activeNavLink = navList.querySelector('.nav-link.active');
      requestAnimationFrame(() => moveNavIndicator(activeNavLink));
      navLinks.forEach((link) => {
        link.addEventListener('mouseenter', () => moveNavIndicator(link));
      });
      navList.addEventListener('mouseleave', () => moveNavIndicator(activeNavLink));
      window.addEventListener('resize', () => moveNavIndicator(navList.querySelector('.nav-link.active')));
    }
  </script>
</body>
</html>
