<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practify - Exam Review</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/perfil.css">
  <link rel="icon" type="image/png" href="img/image.png">
  <style>
    .review-container {
      max-width: 800px;
      margin: 0 auto;
    }
    .review-card {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 24px;
      padding: 30px;
      margin-bottom: 20px;
      transition: var(--transition);
    }
    .review-card.correct {
      border-left: 6px solid #2ECC71;
    }
    .review-card.wrong {
      border-left: 6px solid #E74C3C;
    }
    .status-badge {
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 100px;
    }
    .badge-correct { background: rgba(46, 204, 113, 0.15); color: #27AE60; }
    .badge-wrong { background: rgba(231, 76, 60, 0.15); color: #C0392B; }
    .answer-box {
      padding: 12px 16px;
      border-radius: 12px;
      margin-top: 10px;
      font-size: 0.95rem;
    }
    .user-answer { background: rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.05); }
    .correct-answer { background: rgba(46, 204, 113, 0.1); border: 1px solid rgba(46, 204, 113, 0.2); color: #27AE60; font-weight: 600; }
    .review-media {
      max-width: 100%;
      border-radius: 12px;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-light">
    <div class="container">
      <a class="navbar-brand wordmark-nav" href="home.html"><span class="w-blue">Pract</span><span class="w-purple">ify</span></a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto" id="navSlider">
          <span class="nav-pill-indicator" id="navPillIndicator"></span>
          <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="examenes.html">Exams</a></li>
          <li class="nav-item"><a class="nav-link" href="sobre.html">About</a></li>
          <li class="nav-item"><a class="nav-link active" href="perfil.html">Profile</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container page-header pb-5">
    <div class="review-container reveal">
      <div class="text-center mb-5">
        <h1 class="fw-bold">Exam Review</h1>
        <p class="text-muted" id="examTitle">Loading exam details...</p>
        <div class="d-flex justify-content-center gap-3">
          <div class="stat-card px-4">
            <div class="value" id="finalScore">--%</div>
            <div class="label">Final Score</div>
          </div>
        </div>
      </div>

      <div id="reviewList">
        <div class="text-center py-5">
          <div class="spinner-border text-primary" role="status"></div>
          <p class="mt-3 text-muted">Analyzing your performance...</p>
        </div>
      </div>

      <div class="text-center mt-5">
        <a href="examenes.html" class="btn-practfy">Back to Exams</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/review.js"></script>
  <script>
    const navList = document.getElementById('navSlider');
    const navIndicator = document.getElementById('navPillIndicator');
    const navLinks = navList?.querySelectorAll('.nav-link');

    function moveNavIndicator(el) {
      if (!el || !navIndicator) return;
      navIndicator.style.left = el.offsetLeft + 'px';
      navIndicator.style.width = el.offsetWidth + 'px';
    }

    if (navLinks) {
      const activeNavLink = navList.querySelector('.nav-link.active');
      requestAnimationFrame(() => moveNavIndicator(activeNavLink));
      navLinks.forEach((link) => {
        link.addEventListener('mouseenter', () => moveNavIndicator(link));
      });
      navList.addEventListener('mouseleave', () => moveNavIndicator(activeNavLink));
      window.addEventListener('resize', () => moveNavIndicator(navList.querySelector('.nav-link.active')));
    }
  </script>
</body>
</html>
