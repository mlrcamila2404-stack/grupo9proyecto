<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practfy - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

 <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="home.html">Practify</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="perfil.html">Profile</a></li>
          <li class="nav-item"><a class="nav-link active" href="examenes.html">Exams</a></li>
          <li class="nav-item"><a class="nav-link active" href="sobre.html">Home</a></li>
        </ul>
      </div>
    </div>
  </nav>
  
  <div class="auth-shell">


    <div class="wordmark"><span class="w-blue">Prac</span><span class="w-purple">tify</span></div>
  <div class="pitch">
        <p>Listening, Reading and more test-style exams, ready when you want.</p>
      </div>
   
 
     

    <div class="auth-form-panel">
      <h2>Login</h2>
      <p class="subtitle">Enter your details to continue practicing.</p>
 
      <form>
        <div class="field">
          <label for="usuario">Username</label>
          <input type="text" id="usuario" name="usuario" class="form-control" placeholder="Your username" autocomplete="username" required>
        </div>
 
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Your password" autocomplete="current-password" required>
        </div>
 
        <button type="submit" class="btn-practfy"> <a href="examenes.html">Login</a></button>
 
        <div class="switch-link">
          Don't have an account? <a href="registro.html">Sign Up</a>
        </div>
      </form>
    </div>
 
  </div>
</body>
</html>
