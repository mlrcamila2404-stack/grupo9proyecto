<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practify - Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/perfil.css" rel="stylesheet">
   <link rel="icon" type="image/png" href="img/image.png">
</head>
<body>
 
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top">
    <div class="container">
      <a class="navbar-brand wordmark-nav" href="home.html"><span class="w-blue">Prac</span><span class="w-purple">tify</span></a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="examenes.html">Exams</a></li>
          <li class="nav-item"><a class="nav-link active" href="perfil.html">Profile</a></li>
        </ul>
      </div>
    </div>
  </nav>
 
  <div class="container page-header pb-5">
 
    <div class="panel mb-4 d-flex flex-wrap align-items-center gap-3 justify-content-between">
      <div class="d-flex align-items-center gap-3">
        <div class="avatar-circle">JD</div>
        <div>
          <h4 class="mb-0 fw-bold">ericksonz</h4>
          <div class="text-muted small">@erisito &middot; ericksonz@correo.com</div>
        </div>
      </div>
      <div class="d-flex gap-2">
        <button class="btn-practfy" type="button" data-bs-toggle="collapse" data-bs-target="#editProfileForm" aria-expanded="false" aria-controls="editProfileForm">Edit Profile</button>
        <button class="btn-outline-practfy" type="button">Logout</button>
      </div>
    </div>

  <div class="collapse" id="editProfileForm">
      <div class="panel">
        <h5 class="fw-bold mb-3">Edit Profile</h5>
        <form>
          <div class="row g-3">
            <div class="col-md-6 field">
              <label for="nombre">Full Name</label>
              <input type="text" id="nombre" class="form-control" value="Juan Díaz">
            </div>
            <div class="col-md-6 field">
              <label for="usuario">Username</label>
              <input type="text" id="usuario" class="form-control" value="juandiaz">
            </div>
            <div class="col-md-6 field">
              <label for="email">Email</label>
              <input type="email" id="email" class="form-control" value="juan.diaz@correo.com">
            </div>
            <div class="col-md-6 field">
              <label for="password">New Password</label>
              <input type="password" id="password" class="form-control" placeholder="Leave blank to not change">
            </div>
          </div>
          <button type="submit" class="btn-practfy mt-4">Save Changes</button>
        </form>
      </div>
    </div>
    
    <div class="row g-3 mb-4">
      <div class="col-6 col-md-6">
        <div class="stat-card">
          <div class="value">18</div>
          <div class="label">Exams Completed</div>
        </div>
      </div>
      <div class="col-6 col-md-6">
        <div class="stat-card">
          <div class="value">76%</div>
          <div class="label">Overall Average</div>
        </div>
      </div>
    </div>
 
    <div class="panel mb-4">
      <h5 class="fw-bold mb-3">General Progress</h5>
 
      <div class="progress-hero mb-4">
        <div class="small fw-semibold">Total Progress</div>
        <div class="big-number">68%</div>
        <div class="small">of all completed exams</div>
      </div>
 
      <div class="skill-row">
        <div class="skill-top">
          <span class="name">Listening</span>
          <span class="count">3 / 4 practices &middot; 80%</span>
        </div>
        <div class="progress">
          <div class="progress-bar progress-bar-blue" style="width: 80%"></div>
        </div>
      </div>
 
      <div class="skill-row">
        <div class="skill-top">
          <span class="name">Reading</span>
          <span class="count">2 / 4 practices &middot; 55%</span>
        </div>
        <div class="progress">
          <div class="progress-bar progress-bar-purple" style="width: 55%"></div>
        </div>
      </div>
 
      <div class="skill-row mb-0">
        <div class="skill-top">
          <span class="name">Full Test</span>
          <span class="count">1 / 3 practices &middot; 35%</span>
        </div>
        <div class="progress">
          <div class="progress-bar progress-bar-cyan" style="width: 35%"></div>
        </div>
      </div>
    </div>
 
   
 
  </div>
 
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
 
</body>
</html>
