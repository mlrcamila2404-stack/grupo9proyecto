
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practfy - Sign Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

   <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="home.html">Practify</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="perfil.html">Profile</a></li>
          <li class="nav-item"><a class="nav-link active" href="examenes.html">Exams</a></li>
          <li class="nav-item"><a class="nav-link active" href="sobre.html">Home</a></li>
        </ul>
      </div>
    </div>
  </nav>


  <div class="auth-shell">
 
   <div class="wordmark" style="padding-top: 50px;"><span class="w-blue">Prac</span><span class="w-purple">tify</span></div>

      <div class="pitch">
        <p>Create your free account and access Listening, Reading and more exams.</p>
      </div>
 
    <div class="auth-form-panel">
      <h2>Sign Up</h2>
 
      <form>
        <div class="field">
          <label for="nombre">Full Name</label>
          <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Your full name" autocomplete="name" required>
        </div>
 
        <div class="field">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="your.email@example.com" autocomplete="email" required>
        </div>
 
        <div class="field">
          <label for="usuario">Username</label>
          <input type="text" id="usuario" name="usuario" class="form-control" placeholder="Choose a username" autocomplete="username" required>
        </div>
 
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Create a password" autocomplete="new-password" required>
        </div>
 
        <div class="field">
          <label for="password2">Confirm Password</label>
          <input type="password" id="password2" name="password2" class="form-control" placeholder="Re-type your password" autocomplete="new-password" required>
        </div>
 
        <button type="submit" class="btn-practfy"><a href="examenes.html">Create Account</a></button>
 
        <div class="switch-link">
          Do you already have an account? <a href="login.html">Log in</a>
        </div>
      </form>
    </div>
 
  </div>
</body>
</html>
