<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practify - Feedback</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/retroalimentacion.css">
 <link rel="icon" type="image/png" href="img/image.png">
</head>
<body>
 
  <div class="bg-shape s1"></div>
  <div class="bg-shape s2"></div>
 
  <div class="feedback-wrap">
 
    <div class="wordmark-nav" style="text-align:center; margin-bottom: 24px;">
      <span class="w-prac">Prac</span><span class="w-tify">tify</span>
    </div>
 
    <div class="screen-title">Great job!</div>
    <div class="screen-sub">You're on the right track, keep it up!</div>
 
    <div class="result-card">
      <div class="circle-progress" style="background: conic-gradient(#3A86EF 0% 68%, #EEF0FB 68% 100%);">
        <div class="inner">
          <div class="score" style="color:#3A86EF;">68%</div>
          <div class="score-label">Score</div>
        </div>
      </div>
 
      <span class="badge-level" style="background: rgba(58,134,239,0.15); color:#2C5FB0;">👍 Good Performance</span>
 
      <div class="stats-grid">
        <div class="stat correct">
          <div class="num">14</div>
          <div class="label">Correct Answers</div>
        </div>
        <div class="stat wrong">
          <div class="num">6</div>
          <div class="label">Incorrect Answers</div>
        </div>
        <div class="stat">
          <div class="num">15:10</div>
          <div class="label">Time</div>
        </div>
      </div>
    </div>
 
    <div class="feedback-box">
      <h6>Feedback</h6>
      <div class="feedback-item"><span class="icon">✅</span><span>Good understanding of main ideas.</span></div>
      <div class="feedback-item"><span class="icon">⚠️</span><span>Review inference questions.</span></div>
      <div class="feedback-item"><span class="icon">⚠️</span><span>Strengthen vocabulary in context.</span></div>
    </div>
 
    <div class="actions">
      
      <a href="examenes.html" class="btn-fill-style">Continue</a>
    </div>
 
  </div>
 
</body>
</html>
